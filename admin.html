<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 | 우리들의 시선</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf9f6;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      color: #262626;
    }

    .login-box {
      width: min(90%, 400px);
      padding: 42px 36px;
      background: white;
      border: 1px solid #e8e5df;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 2px;
      color: #918675;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .description {
      color: #777;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      background: #262626;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="eyebrow">SCHOOL PHOTO EXHIBITION</div>

    <h1>관리자 로그인</h1>

    <p class="description">
      사진전 관리자만 로그인할 수 있습니다.
    </p>

    <form id="login-form">

      <label for="email">이메일</label>
      <input
        id="email"
        type="email"
        placeholder="관리자 이메일"
        required
      >

      <label for="password">비밀번호</label>
      <input
        id="password"
        type="password"
        placeholder="비밀번호"
        required
      >

      <button type="submit" id="login-button">
        로그인
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // ==========================================
    // 여기에 Supabase 정보를 넣어주세요.
    // ==========================================

    const SUPABASE_URL = "https://hdlzszibzapenifdxuub.supabase.co";

    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkbHpzemliemFwZW5pZmR4dXViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODc4NTMsImV4cCI6MjEwNzI2Mzg1M30.TGHmdHBWRnZ8rJzy2tioadQqt790sWq3MiD1BYaF4Ac";

    // ==========================================

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      button.disabled = true;
      button.textContent = "로그인 중...";
      message.textContent = "";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {

        message.textContent =
          "로그인에 실패했습니다. 이메일과 비밀번호를 확인해주세요.";

        button.disabled = false;
        button.textContent = "로그인";

        return;
      }

      // 로그인 성공
      window.location.href = "dashboard.html";

    });

  </script>

</body>
</html>
