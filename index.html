
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IMAGE 마흔한번째 사진전">
  <title>IMAGE 마흔한번째 사진전</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #262626;
      background: #faf9f6;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    }

    header {
      padding: 24px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e8e5df;
      gap: 16px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    nav { white-space: nowrap; }

    nav a {
      margin-left: 20px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      padding: 76px 7% 54px;
      text-align: center;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 3px;
      color: #8a806f;
    }

    h1 {
      margin: 20px 0;
      font-size: clamp(34px, 7vw, 68px);
      line-height: 1.25;
      letter-spacing: -2px;
      overflow-wrap: anywhere;
    }

    .intro {
      color: #777;
      font-size: 15px;
      line-height: 1.9;
    }

    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 7% 80px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 32px 22px;
    }

    .photo { margin: 0; min-width: 0; }

    .photo img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #e8e5df;
    }

    figcaption { padding-top: 13px; }

    .category {
      font-size: 11px;
      color: #948978;
      letter-spacing: 1px;
    }

    .photo h2 {
      font-size: 18px;
      margin: 7px 0;
      overflow-wrap: anywhere;
    }

    .photo p {
      color: #777;
      font-size: 13px;
      line-height: 1.7;
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .author {
      margin-top: 9px;
      font-size: 12px;
      color: #61594f;
    }

    .notice {
      grid-column: 1 / -1;
      padding: 50px 10px;
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.8;
    }

    footer {
      padding: 28px 7%;
      text-align: center;
      border-top: 1px solid #e8e5df;
      color: #888;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header { padding: 20px 5%; }
      .logo { font-size: 16px; }
      nav a { margin-left: 10px; font-size: 12px; }
      .hero { padding: 58px 5% 36px; }
      .gallery {
        padding: 10px 5% 55px;
        gap: 25px 12px;
      }
      .photo h2 { font-size: 15px; }
      .photo p { font-size: 12px; }
      .author { font-size: 11px; }
    }

    @media (max-width: 360px) {
      header { align-items: flex-start; flex-direction: column; }
      nav a { margin: 0 14px 0 0; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">이미지 마흔한번째 사진전</div>
    <nav>
      <a href="#about">전시 소개</a>
      <a href="#gallery">작품 보기</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="about">
      <div class="eyebrow">IMAGE · PHOTO EXHIBITION</div>
      <h1>이미지 마흔한번째<br>사진전</h1>
      <p class="intro">
        평범한 하루 속에서 발견한 특별한 장면들.<br>
        우리가 바라본 세상을 사진으로 기록합니다.
      </p>
    </section>

    <section class="gallery" id="gallery" aria-label="전시 작품">
      <div class="notice" id="gallery-status" role="status">
        전시 작품을 불러오는 중입니다.
      </div>
    </section>
  </main>

  <footer>
    이미지 마흔한번째 사진전
  </footer>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Supabase 프로젝트 정보
    // admin.html에 입력한 값과 동일하게 설정하세요.
    const SUPABASE_URL =
      "https://hdlzszibzapenifdxuub.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkbHpzemliemFwZW5pZmR4dXViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODc4NTMsImV4cCI6MjEwNzI2Mzg1M30.TGHmdHBWRnZ8rJzy2tioadQqt790sWq3MiD1BYaF4Ac";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const gallery = document.getElementById("gallery");
    const status = document.getElementById("gallery-status");

    function makeTextElement(tag, className, text) {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = text || "";
      return element;
    }

    async function loadPhotos() {
      const { data: photos, error } = await supabase
        .from("photos")
        .select("id, title, author_name, description, image_path, created_at")
        .eq("is_published", true)
        .order("created_at", { ascending: false });

      if (error) {
        console.error("사진 불러오기 오류:", error);
        status.textContent =
          "작품을 불러오지 못했습니다. 잠시 후 다시 확인해주세요.";
        return;
      }

      status.remove();

      if (!photos || photos.length === 0) {
        gallery.appendChild(
          makeTextElement(
            "div",
            "notice",
            "아직 공개된 작품이 없습니다. 새로운 작품을 기다려주세요."
          )
        );
        return;
      }

      photos.forEach((photo, index) => {
        const figure = document.createElement("figure");
        figure.className = "photo";

        const { data } = supabase.storage
          .from("exhibition-photos")
          .getPublicUrl(photo.image_path);

        const image = document.createElement("img");
        image.src = data.publicUrl;
        image.alt = photo.title || "전시 사진";
        image.loading = index < 2 ? "eager" : "lazy";

        image.onerror = () => {
          image.alt = "이미지를 불러올 수 없습니다.";
        };

        const caption = document.createElement("figcaption");

        caption.appendChild(
          makeTextElement(
            "div",
            "category",
            `EXHIBITION · ${String(index + 1).padStart(2, "0")}`
          )
        );

        caption.appendChild(
          makeTextElement("h2", "", photo.title)
        );

        caption.appendChild(
          makeTextElement("p", "", photo.description)
        );

        if (photo.author_name && photo.author_name.trim()) {
          caption.appendChild(
            makeTextElement(
              "div",
              "author",
              `작가 · ${photo.author_name}`
            )
          );
        }

        figure.appendChild(image);
        figure.appendChild(caption);
        gallery.appendChild(figure);
      });
    }

    loadPhotos();
  </script>
</body>
</html>
