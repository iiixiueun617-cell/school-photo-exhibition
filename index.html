
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리의 시선 | 학교 사진전</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #262626;
      background: #faf9f6;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    }
    header {
      padding: 24px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e8e5df;
    }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: -1px; }
    nav a {
      margin-left: 20px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }
    .hero {
      padding: 76px 7% 54px;
      text-align: center;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 3px;
      color: #8a806f;
    }
    h1 {
      margin: 20px 0;
      font-size: clamp(36px, 7vw, 68px);
      line-height: 1.2;
      letter-spacing: -3px;
    }
    .intro {
      color: #777;
      font-size: 15px;
      line-height: 1.9;
    }
    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 7% 80px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px 22px;
    }
    .photo { margin: 0; }
    .photo img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #e8e5df;
    }
    figcaption { padding-top: 13px; }
    .category {
      font-size: 11px;
      color: #948978;
      letter-spacing: 1px;
    }
    .photo h2 { font-size: 18px; margin: 7px 0; }
    .photo p { color: #777; font-size: 13px; line-height: 1.7; margin: 0; }
    footer {
      padding: 28px 7%;
      text-align: center;
      border-top: 1px solid #e8e5df;
      color: #888;
      font-size: 12px;
    }
    @media (max-width: 600px) {
      header { padding: 20px 5%; }
      nav a { margin-left: 10px; font-size: 12px; }
      .hero { padding: 58px 5% 36px; }
      .gallery { padding: 10px 5% 55px; gap: 24px 12px; }
      .photo h2 { font-size: 15px; }
      .photo p { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">OUR PERSPECTIVE.</div>
    <nav>
      <a href="#about">전시 소개</a>
      <a href="#gallery">작품 보기</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="about">
      <div class="eyebrow">SCHOOL PHOTO EXHIBITION</div>
      <h1>우리의 시선,<br>우리의 순간.</h1>
      <p class="intro">
        평범한 하루 속에서 발견한 특별한 장면들.<br>
        우리가 바라본 세상을 사진으로 기록합니다.
      </p>
    </section>

    <section class="gallery" id="gallery">
      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="산과 호수가 있는 풍경">
        <figcaption>
          <div class="category">LANDSCAPE · 01</div>
          <h2>고요한 아침</h2>
          <p>잠시 멈춰 서서 바라본 풍경.</p>
        </figcaption>
      </figure>

      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="햇살이 비치는 들판">
        <figcaption>
          <div class="category">NATURE · 02</div>
          <h2>빛이 머무는 곳</h2>
          <p>매일 마주하지만 지나치기 쉬운 순간.</p>
        </figcaption>
      </figure>

      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=80" alt="바다의 파도">
        <figcaption>
          <div class="category">MOMENT · 03</div>
          <h2>파도의 기록</h2>
          <p>끊임없이 밀려오고 다시 돌아가는 시간.</p>
        </figcaption>
      </figure>

      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="나무 사이로 보이는 숲길">
        <figcaption>
          <div class="category">DAILY LIFE · 04</div>
          <h2>우리만의 길</h2>
          <p>익숙한 길에서 발견한 새로운 장면.</p>
        </figcaption>
      </figure>
    </section>
  </main>

  <footer>
    OUR PERSPECTIVE · SCHOOL PHOTO EXHIBITION
  </footer>
</body>
</html>
