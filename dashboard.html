
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사진전 관리자</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: #f6f5f1;
      color: #292929;
      font-family: -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    h1 { font-size: 25px; }
    h2 { font-size: 20px; margin-top: 0; }

    .panel {
      background: white;
      border: 1px solid #e4e1d9;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #d4d1c9;
      border-radius: 8px;
      background: white;
      color: #292929;
      font: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      background: #292929;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .secondary {
      background: #e8e5dd;
      color: #292929;
    }

    .delete-button {
      background: #a12b2b;
      padding: 8px 12px;
      margin-top: 12px;
    }

    #upload-button {
      width: 100%;
      margin-top: 20px;
    }

    #message {
      margin-top: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.6;
    }

    .photo-card {
      display: grid;
      grid-template-columns: minmax(110px, 190px) 1fr;
      gap: 18px;
      padding: 18px 0;
      border-bottom: 1px solid #e8e5dd;
    }

    .photo-card:last-child { border-bottom: 0; }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .photo-info h3 {
      margin: 8px 0;
      overflow-wrap: anywhere;
    }

    .photo-info p {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      background: #e7eee4;
      font-size: 12px;
    }

    .status.private { background: #eee5df; }

    .muted {
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .panel { padding: 16px; }
      .photo-card {
        grid-template-columns: 100px minmax(0, 1fr);
        gap: 12px;
      }
      h1 { font-size: 21px; }
    }
  </style>
</head>

<body>
<main>
  <header>
    <h1>사진전 관리자</h1>
    <button id="logout-button" class="secondary" type="button">
      로그아웃
    </button>
  </header>

  <section class="panel">
    <h2>새 사진 등록</h2>
    <p class="muted">사진과 정보를 입력한 뒤 등록 버튼을 눌러 주세요.</p>

    <form id="upload-form">
      <label for="photo-file">사진 파일 *</label>
      <input
        id="photo-file"
        type="file"
        accept="image/*"
        required
      >

      <label for="photo-title">사진 제목 *</label>
      <input
        id="photo-title"
        type="text"
        maxlength="200"
        placeholder="사진 제목을 입력해 주세요"
        required
      >

      <label for="photo-author">작가명</label>
      <input
        id="photo-author"
        type="text"
        maxlength="100"
        placeholder="작가명을 입력해 주세요"
      >

      <label for="photo-description">사진 설명</label>
      <textarea
        id="photo-description"
        maxlength="3000"
        placeholder="사진에 대한 간단한 설명을 입력해 주세요"
      ></textarea>

      <button id="upload-button" type="submit">
        사진 등록
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="panel">
    <h2>등록된 사진</h2>
    <p class="muted">
      사진을 삭제하면 사진 정보와 저장된 파일을 삭제합니다.
    </p>
    <div id="photo-list">사진 목록을 불러오는 중...</div>
  </section>
</main>

<!-- Supabase JavaScript 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(() => {
  "use strict";

  // 기존 Supabase 프로젝트 정보
  const SUPABASE_URL =
    "https://hdlzszibzapenifdxuub.supabase.co";

  // 기존에 사용하던 공개용 anon 키를 여기에 입력하세요.
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkbHpzemliemFwZW5pZmR4dXViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODc4NTMsImV4cCI6MjEwNzI2Mzg1M30.TGHmdHBWRnZ8rJzy2tioadQqt790sWq3MiD1BYaF4Ac";

  const BUCKET = "exhibition-photos";

  const message = document.getElementById("message");
  const form = document.getElementById("upload-form");
  const fileInput = document.getElementById("photo-file");
  const titleInput = document.getElementById("photo-title");
  const authorInput = document.getElementById("photo-author");
  const descriptionInput = document.getElementById("photo-description");
  const uploadButton = document.getElementById("upload-button");
  const photoList = document.getElementById("photo-list");
  const logoutButton = document.getElementById("logout-button");

  let client;
  let currentUser = null;
  let busy = false;

  function showMessage(text) {
    message.textContent = text;
  }

  function showError(prefix, error) {
    console.error(prefix, error);
    const detail = error?.message || error?.details ||
      error?.hint || JSON.stringify(error) || "원인을 확인할 수 없습니다.";
    showMessage(prefix + "\n" + detail);
  }

  function makeElement(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }

  async function checkAdmin() {
    const { data, error } = await client.auth.getSession();

    if (error) throw error;

    const session = data.session;

    if (!session) {
      window.location.replace("admin.html");
      return false;
    }

    currentUser = session.user;

    // 로그인 사용자에게 관리자 권한이 있는지 확인
    const { data: admin, error: adminError } = await client
      .from("photo_admins")
      .select("user_id")
      .eq("user_id", currentUser.id)
      .maybeSingle();

    if (adminError) {
      throw new Error(
        "관리자 권한 확인 실패: " + adminError.message
      );
    }

    if (!admin) {
      showMessage(
        "이 계정에는 관리자 권한이 없습니다. 관리자 계정을 확인해 주세요."
      );
      uploadButton.disabled = true;
      return false;
    }

    return true;
  }

  async function loadPhotos() {
    photoList.replaceChildren(
      makeElement("p", "muted", "사진을 불러오는 중...")
    );

    const { data, error } = await client
      .from("photos")
      .select("id, title, author_name, description, image_path, is_published, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      photoList.replaceChildren(
        makeElement("p", "", "사진 목록을 불러오지 못했습니다.")
      );
      console.error("사진 목록 조회 오류:", error);
      showMessage("사진 목록 조회 실패: " + error.message);
      return;
    }

    photoList.replaceChildren();

    if (!data || data.length === 0) {
      photoList.appendChild(
        makeElement("p", "muted", "아직 등록된 사진이 없습니다.")
      );
      return;
    }

    for (const photo of data) {
      const card = makeElement("article", "photo-card");

      const { data: urlData } = client.storage
        .from(BUCKET)
        .getPublicUrl(photo.image_path);

      const img = makeElement("img");
      img.src = urlData.publicUrl;
      img.alt = photo.title || "전시 사진";
      img.loading = "lazy";

      const info = makeElement("div", "photo-info");

      info.appendChild(
        makeElement(
          "span",
          photo.is_published ? "status" : "status private",
          photo.is_published ? "공개" : "비공개"
        )
      );

      info.appendChild(makeElement("h3", "", photo.title));
      
      if (photo.author_name) {
        info.appendChild(
          makeElement("p", "muted", "작가: " + photo.author_name)
        );
      }

      info.appendChild(
        makeElement("p", "", photo.description || "설명 없음")
      );

      const deleteButton = makeElement(
        "button", "delete-button", "삭제"
      );
      deleteButton.type = "button";

      deleteButton.addEventListener("click", async () => {
        if (!confirm("이 사진을 삭제할까요?")) return;

        deleteButton.disabled = true;

        try {
          const { error: dbError } = await client
            .from("photos")
            .delete()
            .eq("id", photo.id);

          if (dbError) {
            throw new Error("사진 정보 삭제 실패: " + dbError.message);
          }

          const { error: storageError } = await client.storage
            .from(BUCKET)
            .remove([photo.image_path]);

          if (storageError) {
            showMessage(
              "사진 정보는 삭제했지만 파일 삭제에 실패했습니다: " +
              storageError.message
            );
          } else {
            showMessage("사진이 삭제되었습니다.");
          }

          await loadPhotos();
        } catch (error) {
          showError("삭제 실패", error);
          deleteButton.disabled = false;
        }
      });

      info.appendChild(deleteButton);
      card.append(img, info);
      photoList.appendChild(card);
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (busy) return;

    const file = fileInput.files?.[0];
    const title = titleInput.value.trim();
    const authorName = authorInput.value.trim();
    const description = descriptionInput.value.trim();

    if (!file) {
      showMessage("사진 파일을 선택해 주세요.");
      return;
    }

    if (!file.type.startsWith("image/")) {
      showMessage("이미지 파일만 등록할 수 있습니다.");
      return;
    }

    if (!title) {
      showMessage("사진 제목을 입력해 주세요.");
      titleInput.focus();
      return;
    }

    if (!currentUser) {
      showMessage("로그인 상태를 확인할 수 없습니다. 다시 로그인해 주세요.");
      return;
    }

    busy = true;
    uploadButton.disabled = true;
    uploadButton.textContent = "등록 중...";
    showMessage("사진을 등록하고 있습니다. 잠시 기다려 주세요.");

    let filePath = null;
    let uploadCompleted = false;

    try {
      const safeName = file.name
        .normalize("NFKC")
        .replace(/[^a-zA-Z0-9._-]/g, "-");

      const uniqueName =
        Date.now() + "-" +
        Math.random().toString(36).slice(2, 10) +
        "-" + safeName;

      filePath = currentUser.id + "/" + uniqueName;

      const { error: uploadError } = await client.storage
        .from(BUCKET)
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (uploadError) {
        throw new Error("사진 파일 업로드 실패: " + uploadError.message);
      }

      uploadCompleted = true;

      const { error: insertError } = await client
        .from("photos")
        .insert({
          title: title,
          author_name: authorName,
          description: description,
          image_path: filePath,
          is_published: true
        });

      if (insertError) {
        throw new Error("사진 정보 저장 실패: " + insertError.message);
      }

      showMessage("사진이 등록되었습니다.");

      form.reset();
      await loadPhotos();

    } catch (error) {
      showError("등록 실패", error);

      // DB 저장에 실패했다면 방금 올린 파일을 정리
      if (uploadCompleted && filePath) {
        const { error: cleanupError } = await client.storage
          .from(BUCKET)
          .remove([filePath]);

        if (cleanupError) {
          console.error("업로드 파일 정리 실패:", cleanupError);
        }
      }

    } finally {
      busy = false;
      uploadButton.disabled = false;
      uploadButton.textContent = "사진 등록";
    }
  });

  logoutButton.addEventListener("click", async () => {
    logoutButton.disabled = true;

    try {
      const { error } = await client.auth.signOut();
      if (error) throw error;
      window.location.replace("admin.html");
    } catch (error) {
      showError("로그아웃 실패", error);
      logoutButton.disabled = false;
    }
  });

  async function init() {
    try {
      if (!window.supabase) {
        throw new Error(
          "Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."
        );
      }

      if (
        !SUPABASE_KEY ||
        SUPABASE_KEY === "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkbHpzemliemFwZW5pZmR4dXViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODc4NTMsImV4cCI6MjEwNzI2Mzg1M30.TGHmdHBWRnZ8rJzy2tioadQqt790sWq3MiD1BYaF4Ac"
      ) {
        throw new Error(
          "코드 안의 SUPABASE_KEY에 기존 anon 키를 입력해 주세요."
        );
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      showMessage("관리자 로그인과 권한을 확인하고 있습니다.");

      const allowed = await checkAdmin();
      if (!allowed) return;

      showMessage("");
      await loadPhotos();

    } catch (error) {
      showError("관리자 페이지 초기화 실패", error);
      uploadButton.disabled = true;
    }
  }

  init();
})();
</script>
</body>
</html>
